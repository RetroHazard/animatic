[workspace]
resolver = "3"
members = ["crates/animatic-core", "crates/animatic-anidb", "crates/animatic"]

[workspace.package]
version = "2026.11.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RetroHazard/animatic"
authors = ["RetroHazard"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# CI checks (clippy, test, doc). Same semantics as dev, including debug assertions and
# overflow checks, but dependencies are not optimized and only line tables are emitted:
# the cold build is far cheaper and the cached target directory far smaller. Local
# development keeps the optimized-dependency dev profile above.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
