name: Release

# A release is gated behind two things: a reviewed merge to main and a release tag created
# at that exact merge commit. Merging a `release`-labelled pull request (the one Prepare
# release opens) makes auto-release.yml dispatch this workflow with the merge commit. The
# workflow validates that commit, builds clean archives through ci.yml, and only then
# creates the tag vVERSION at the commit and publishes the GitHub Release. Tags are never
# pushed by hand, and a tag push does not start this workflow. A manual run from main can
# rehearse (dry run) or retry a failed publication of a commit that has no release yet.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release (default the tip of main); its Cargo.toml version becomes the tag. Must be on main unless dry_run; a dry run may rehearse a release/vVERSION head
        type: string
        default: ''
      dry_run:
        description: Build and upload packages without creating a tag or a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time; never cancel a half-published release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require reviewed workflow code
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify a main commit whose version has no release yet
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          sha="$(git rev-parse --verify "${INPUT_SHA:-$GITHUB_SHA}^{commit}")"
          # Anything that publishes must be on main. A dry run publishes nothing, so it may
          # rehearse the head of an unmerged release/vVERSION branch.
          if [ "$DRY_RUN" != true ]; then
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          fi
          git checkout --detach "$sha"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          python scripts/release.py validate --tag "$tag"
          # A tag may only exist already when a previous run of this commit created it and
          # then failed before publishing; it must never point anywhere else.
          if existing="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")"; then
            if [ "$existing" != "$sha" ]; then
              echo "::error::$tag already points at $existing, not $sha"
              exit 1
            fi
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::a GitHub Release for $tag already exists; it is never overwritten"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
            if [[ "$version" == *-* ]]; then
              echo 'prerelease=true'
            else
              echo 'prerelease=false'
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha (dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      package: true

  bundle:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*-x86_64
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: python scripts/release.py checksums --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-v${{ needs.validate.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [validate, bundle]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle-v${{ needs.validate.outputs.version }}
          path: dist
      - name: Extract reviewed release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/release.py notes --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
      # The tag is created here, at the validated commit, only after the archives exist.
      # A tag created with the workflow token starts no other workflow.
      - name: Tag the validated commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          # Refuse a tag that appeared, pointing elsewhere, between validation and now.
          gh auth setup-git
          if git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2> /dev/null; then
            actual="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$actual" != "$EXPECTED_SHA" ]; then
              echo "::error::$RELEASE_TAG points at $actual, not the validated $EXPECTED_SHA"
              exit 1
            fi
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --target "$EXPECTED_SHA" --title "Animatic $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
