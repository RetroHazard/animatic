name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed CalVer tag, for example v2026.11.0 or v2026.11.0-rc.1
        required: true
        type: string
      dry_run:
        description: Build and upload packages without creating a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require reviewed workflow code for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify an exact tag on reviewed main history
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" > "$RUNNER_TEMP/release-sha"
          sha=$(cat "$RUNNER_TEMP/release-sha")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$sha" = "$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          git checkout --detach "$sha"
          python scripts/release.py validate --tag "$RELEASE_TAG"
          {
            echo "sha=$sha"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            if [[ "$RELEASE_TAG" == *-* ]]; then
              echo 'prerelease=true'
            else
              echo 'prerelease=false'
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      package: true

  bundle:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*-x86_64
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: python scripts/release.py checksums --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-v${{ needs.validate.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    needs: [validate, bundle]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle-v${{ needs.validate.outputs.version }}
          path: dist
      - name: Extract reviewed release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/release.py notes --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create an unsigned draft release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          gh auth setup-git
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$EXPECTED_SHA"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Animatic $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
