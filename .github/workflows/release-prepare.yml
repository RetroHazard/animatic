name: Prepare release

# One reviewed path for both release streams. `stream` picks stable (YYYY.M.PATCH) or beta
# (YYYY.M.PATCH-rc.N, published as a GitHub prerelease); scripts/release.py computes the next
# version of that stream unless `version` overrides it, bumps the versions, writes the
# changelog section (a stable one folds in the betas since the previous stable), pushes
# release/vVERSION and opens a `release`-labelled pull request once ci.yml passed on it.
# Merging that pull request makes Auto release dispatch Release; the stream follows from the
# version, so nothing downstream needs a separate path.
on:
  workflow_dispatch:
    inputs:
      stream:
        description: Release stream
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: 'Optional explicit version (current UTC month, no v prefix; -rc.N for beta). Empty computes the next version of the stream'
        type: string
        default: ''
      dry_run:
        description: Preview changes only; do not push a branch or open a PR
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Require the main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Only for `cargo metadata --locked`, which proves the rewritten lock still resolves.
      # The release tooling's own tests already ran on main in the quality job.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Prepare versions and changelog
        id: prepare
        env:
          STREAM: ${{ inputs.stream }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--stream "$STREAM")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          python scripts/release.py prepare "${args[@]}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python scripts/release.py validate --tag "v$version"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          python scripts/release.py notes --version "$version" --output "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## v$version ($STREAM)"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewable preparation preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preview-v${{ steps.prepare.outputs.version }}
          path: |
            CHANGELOG.md
            Cargo.toml
            Cargo.lock
            crates/*/Cargo.toml
          if-no-files-found: error
          retention-days: 14
      - name: Commit and push a release branch
        id: commit
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml CHANGELOG.md
          git -c commit.gpgsign=false commit -m "chore(release): v$VERSION"
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    if: ${{ !inputs.dry_run }}
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  open-pr:
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Open the checked release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STREAM: ${{ inputs.stream }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKED_SHA: ${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STREAM" = beta ]; then
            published="a GitHub prerelease (beta stream). Installed copies on the Beta update channel offer it as soon as it is published"
          else
            published="the latest GitHub Release (stable stream). Installed copies on either update channel offer it as soon as it is published"
          fi
          printf '%s\n' \
            "Prepared $STREAM version v$VERSION and its changelog. Review the generated notes for accuracy and privacy before merging." \
            '' \
            "Windows and Linux checks passed for commit $CHECKED_SHA: $RUN_URL" \
            '' \
            'This bot-created PR does not trigger a pull_request run. To attach the stable "Required checks" status to the PR head, manually dispatch CI on this release branch (the checks above already passed for the same commit).' \
            '' \
            "Merging this pull request publishes Animatic v$VERSION as $published. The \`release\` label makes Auto release dispatch Release, which validates the merge commit, builds the archives, creates tag v$VERSION at that commit and publishes. Remove the label before merging to merge without releasing." \
            > "$RUNNER_TEMP/release-pr.md"
          gh pr create --base main --head "release/v$VERSION" --title "chore(release): v$VERSION ($STREAM)" --label release --body-file "$RUNNER_TEMP/release-pr.md"
