name: CI

# The `branches` filters below are only an optimization: GitHub has been observed running
# this workflow for a pull request whose real target is a stacked branch, with a
# synthetic merge context whose `base_ref` says main. The `scope` job therefore asks the
# REST API for the pull request's actual base and defers everything unless it is main.
# A push to any other branch never starts this workflow. Nothing here publishes
# anything. Release workflows call it explicitly.
#
# Three modes, so no commit pays for the same work twice:
# - check (pull requests, merge groups, manual and release-preparation runs): Clippy,
#   tests and rustdoc on Windows and Linux in the `ci` profile, plus the license notices.
#   No release executable unless a manual run asks for one.
# - refresh (pushes to main): the merged code was checked on its pull request, so only
#   the dependency caches that pull requests restore are kept current. A cache that
#   already exists for the lockfile and toolchain costs a lookup; a missing one is
#   rebuilt by running the same checks, which also checks that commit.
# - package (`package: true`, releases): the tag is on checked main history, so only the
#   clean, uncached release executables and notices are built and packaged.
on:
  push:
    branches: [main]
  # `edited` is only listened to so that retargeting a pull request onto main (the
  # stacked-branch workflow) gets checked. Title and description edits carry no
  # `changes.base` and skip every job (see the jobs below), so they cost no runner time.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      executables:
        description: Also build release executables and upload them as artifacts
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check instead of the triggering commit
        type: string
        default: ''
      package:
        description: Also package versioned release archives from the checked executables
        type: boolean
        default: false

permissions:
  contents: read

# Only superseded pull request runs are cancelled. Every other run (main pushes,
# merge groups, manual and release-called runs) gets a unique group and always finishes.
concurrency:
  # Any pull request run that checks code (everything except a metadata-only edit) shares
  # the pull request's group, so a new push cancels the older run. The real base is only
  # known from the REST lookup inside the run, so a base is not used here: retargeting
  # away from main cancels the older main run of the same pull request, which is intended.
  # A metadata-only edit gets its own group so it can never cancel a full run in flight.
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch filters and merge-context guards did not prevent observed stacked-PR
  # integration runs. Read the actual target from the API instead of relying on the
  # synthetic merge context. A main target runs checks; every other base is deferred.
  # Deferred PRs run no planner, Quality, Rust, notices, or merge-gate job. A failed
  # lookup leaves `mode` empty and fails the merge gate closed. Non-PR events proceed
  # normally. Metadata-only edits skip this job. No checkout or secrets are printed.
  scope:
    name: Resolve pull request scope
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Look up the actual pull request base
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.base.ref // empty')"
          if [ -z "$base" ]; then
            echo "::error::the pull request API returned no base branch"
            exit 1
          fi
          if [ "$base" = main ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
          else
            echo "mode=defer" >> "$GITHUB_OUTPUT"
            {
              printf '### Stacked pull request deferred\n\n'
              printf 'The actual base branch is %s, not main. Code checks are deferred until the pull request targets main.\n' "$base"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Decide which expensive checks the change needs. Anything uncertain, manual,
  # called by a release workflow, or queued for merge runs everything.
  # Runs only when scope resolved to `run`. Quality, notices and rust need plan (and
  # quality) with the implicit success() condition, so they are skipped with it.
  plan:
    name: Plan checks
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'run' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      licenses: ${{ steps.plan.outputs.licenses }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select the checks this change needs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ inputs.ref }}
          PACKAGE: ${{ inputs.package }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.ref || github.sha }}
        run: |
          args=(plan --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          force=0
          case "$EVENT_NAME" in
            # A main push selects everything so each cache stays current even after a
            # toolchain release; the refresh mode keeps that to a lookup when nothing changed.
            workflow_dispatch | merge_group | push) force=1 ;;
          esac
          if [ -z "$BASE_SHA" ] || [ -n "$CALLER_REF" ] || [ "$PACKAGE" = true ]; then force=1; fi
          if [ "$force" = 1 ]; then args+=(--force); fi
          python scripts/ci.py "${args[@]}" > "$RUNNER_TEMP/ci-plan.json"
          cat "$RUNNER_TEMP/ci-plan.json"
          {
            printf '### Selected checks\n\n```json\n'
            cat "$RUNNER_TEMP/ci-plan.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # Always runs, including documentation-only changes.
  quality:
    name: Quality
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Script behavior tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate version consistency
        run: python scripts/release.py validate
      - name: Validate Markdown links, anchors, fences, and tables
        run: python scripts/ci.py docs
      - name: Install pinned actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP/actionlint"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflows
        run: |
          # actionlint silently skips shell checks when shellcheck is absent, so require it.
          shellcheck --version
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck "$(command -v shellcheck)" -color
      - name: Install Rust formatter
        if: needs.plan.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        if: needs.plan.outputs.rust == 'true'
        run: cargo fmt --all -- --check

  # Dependency license policy and the generated notices bundled into releases.
  # Starts only after quality passed, so a failed quality run spends no further runners.
  # Refresh runs only keep the registry and renderer caches current; they generate nothing.
  notices:
    name: Dependency license notices
    needs: [plan, quality]
    if: needs.plan.outputs.licenses == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_ABOUT_VERSION: '0.9.3'
      # Not a CARGO*/RUST*/CC* name: rust-cache hashes those into its key, and pull
      # requests must compute the same key as the main run that saved the cache.
      CI_MODE: ${{ inputs.package && 'package' || (github.event_name == 'push' && 'refresh' || 'check') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # `cargo about` resolves full metadata and reads every crate's license files, so
      # without a registry cache it downloads the whole dependency graph. Registry only:
      # nothing is compiled here, and ~/.cargo/bin is left to the renderer cache below.
      - name: Look up the main registry cache
        id: registry-lookup
        if: env.CI_MODE == 'refresh'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          cache-bin: false
          lookup-only: true
          save-if: false
      # Release packaging never restores a cache.
      - name: Cache Cargo registry
        id: registry-cache
        if: env.CI_MODE == 'check' || (env.CI_MODE == 'refresh' && steps.registry-lookup.outputs.cache-hit != 'true')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          cache-bin: false
          save-if: ${{ env.CI_MODE == 'refresh' }}
      - name: Fetch dependency sources for the registry cache
        if: env.CI_MODE == 'refresh' && steps.registry-lookup.outputs.cache-hit != 'true'
        run: cargo fetch --locked
      # Release packaging always compiles the renderer from source; only ordinary
      # checks may reuse the binary cached by a main-branch run.
      - name: Restore cached license renderer
        id: renderer-cache
        if: env.CI_MODE != 'package'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-cli-ubuntu-22.04
          lookup-only: ${{ env.CI_MODE == 'refresh' }}
      - name: Install pinned license renderer
        if: steps.renderer-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "$CARGO_ABOUT_VERSION" --features cli cargo-about
      - name: Verify the renderer CLI
        if: env.CI_MODE != 'refresh' || steps.renderer-cache.outputs.cache-hit != 'true'
        run: |
          version="$(cargo about --version)"
          echo "$version"
          case "$version" in
            *"$CARGO_ABOUT_VERSION"*) ;;
            *) echo "::error::expected cargo-about $CARGO_ABOUT_VERSION"; exit 1 ;;
          esac
      - name: Save license renderer cache
        if: env.CI_MODE == 'refresh' && steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-cli-ubuntu-22.04
      - name: Generate notices for both supported targets
        if: env.CI_MODE != 'refresh'
        run: |
          log="$RUNNER_TEMP/cargo-about.stderr"
          if ! cargo about generate --locked --fail about.hbs --output-file "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" 2> "$log"; then
            cat "$log" >&2
            exit 1
          fi
          cat "$log" >&2
          # cargo-about can warn and succeed after discarding a changed clarification.
          # Require maintainer review rather than silently accepting fallback notices.
          test ! -s "$log"
      - if: env.CI_MODE != 'refresh'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/THIRD-PARTY-NOTICES.html
          if-no-files-found: error
          retention-days: 14

  # Independent of notices so one failure never hides the other's diagnostics; both wait
  # for quality but not for each other.
  rust:
    name: Rust (${{ matrix.platform }})
    needs: [plan, quality]
    if: needs.plan.outputs.rust == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary: animatic.exe
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            binary: animatic
    runs-on: ${{ matrix.os }}
    env:
      # Not CARGO*/RUST*/CC* names: rust-cache hashes those into its key, and pull
      # requests must compute the same key as the main run that saved the cache.
      CI_MODE: ${{ inputs.package && 'package' || (github.event_name == 'push' && 'refresh' || 'check') }}
      CI_EXECUTABLE: ${{ (inputs.package || inputs.executables) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      # A refresh probes without downloading; an exact hit means pull requests already
      # have a cache for this lockfile and toolchain, so the run ends here.
      - name: Look up the main dependency cache
        id: lookup
        if: env.CI_MODE == 'refresh'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          lookup-only: true
          save-if: false
      - name: Select the work for this mode
        id: work
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          checks=false
          case "$CI_MODE" in
            check) checks=true ;;
            refresh) if [ "$CACHE_HIT" != true ]; then checks=true; fi ;;
          esac
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "mode=$CI_MODE checks=$checks executable=$CI_EXECUTABLE"
      # Pull requests restore what main saved; only a refresh saves. Release builds never
      # restore a cache.
      - name: Cache Rust dependencies
        if: steps.work.outputs.checks == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ env.CI_MODE == 'refresh' }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux' && (steps.work.outputs.checks == 'true' || env.CI_EXECUTABLE == 'true')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      # One profile and one target for all three, so rustdoc reuses Clippy's dependency
      # metadata instead of checking the whole graph again.
      - if: steps.work.outputs.checks == 'true'
        run: cargo clippy --locked --workspace --all-targets --profile ci --target ${{ matrix.target }} -- -D warnings
      - if: steps.work.outputs.checks == 'true'
        run: cargo test --locked --workspace --profile ci --target ${{ matrix.target }}
      - if: steps.work.outputs.checks == 'true'
        run: cargo doc --locked --workspace --no-deps --profile ci --target ${{ matrix.target }}
        env:
          RUSTDOCFLAGS: -D warnings
      - if: env.CI_EXECUTABLE == 'true'
        run: cargo build --locked --release -p animatic --target ${{ matrix.target }}
      - name: Smoke the release executable
        if: env.CI_EXECUTABLE == 'true'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --help
      - name: Upload CI executable
        if: env.CI_EXECUTABLE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animatic-${{ matrix.platform }}-x86_64
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  # Release callers only: wrap the checked executables and notices into archives.
  package:
    name: Package (${{ matrix.platform }})
    needs: [rust, notices]
    if: inputs.package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            binary: animatic.exe
          - platform: linux
            binary: animatic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: animatic-${{ matrix.platform }}-x86_64
          path: ${{ runner.temp }}/animatic-executable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/animatic-notices
      - name: Package release archive
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: python scripts/release.py package --platform "$PLATFORM" --binary "$RUNNER_TEMP/animatic-executable/$BINARY" --notices "$RUNNER_TEMP/animatic-notices/THIRD-PARTY-NOTICES.html" --output dist
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-x86_64
          path: dist/animatic-*
          if-no-files-found: error
          retention-days: 14

  # The single stable status to require on main. It fails closed: a job may only be
  # skipped when the plan did not select it, and a failed or cancelled scope, plan or
  # quality job fails it (a failed scope leaves its mode empty, which is not `defer`, so
  # this job still runs and reports the failure). Three cases never report "Required checks":
  # a metadata-only pull request edit is skipped under its own name; a pull request whose
  # actual base (looked up by the scope job) is not main reports the intentionally
  # non-passing "Stacked PR (deferred)" name and is skipped, so neither can ever show
  # "Required checks" as passing or skipped or mask a failure reported for the same commit;
  # and a main push reports "Main cache refresh", because it normally runs no Rust checks.
  required:
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '') && 'PR metadata (no code checks)' || (needs.scope.outputs.mode == 'defer' && 'Stacked PR (deferred)' || (github.event_name == 'push' && 'Main cache refresh' || 'Required checks')) }}
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && needs.scope.outputs.mode != 'defer' }}
    needs: [scope, plan, quality, notices, rust, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify every selected check passed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_RUST: ${{ needs.plan.outputs.rust }}
          CI_LICENSES: ${{ needs.plan.outputs.licenses }}
          CI_PACKAGE: ${{ inputs.package && 'true' || 'false' }}
        run: python scripts/ci.py gate
