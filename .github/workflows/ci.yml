name: CI

# Pull requests and pushes to main are the only automatic triggers; a push to any
# other branch (for example a long-lived dev branch) never starts this workflow,
# and nothing here publishes anything. Release workflows call it explicitly.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check instead of the triggering commit
        type: string
        default: ''
      package:
        description: Also package versioned release archives from the checked executables
        type: boolean
        default: false

permissions:
  contents: read

# Only superseded pull request runs are cancelled. Every other run (main pushes,
# merge groups, manual and release-called runs) gets a unique group and always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which expensive checks the change needs. Anything uncertain, manual,
  # called by a release workflow, or queued for merge runs everything.
  plan:
    name: Plan checks
    runs-on: ubuntu-22.04
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      licenses: ${{ steps.plan.outputs.licenses }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select the checks this change needs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ inputs.ref }}
          PACKAGE: ${{ inputs.package }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.ref || github.sha }}
        run: |
          args=(plan --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          force=0
          case "$EVENT_NAME" in
            workflow_dispatch | merge_group) force=1 ;;
          esac
          if [ -z "$BASE_SHA" ] || [ -n "$CALLER_REF" ] || [ "$PACKAGE" = true ]; then force=1; fi
          if [ "$force" = 1 ]; then args+=(--force); fi
          python scripts/ci.py "${args[@]}" > "$RUNNER_TEMP/ci-plan.json"
          cat "$RUNNER_TEMP/ci-plan.json"
          {
            printf '### Selected checks\n\n```json\n'
            cat "$RUNNER_TEMP/ci-plan.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # Always runs, including documentation-only changes.
  quality:
    name: Quality
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Script behavior tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate version consistency
        run: python scripts/release.py validate
      - name: Validate Markdown links, anchors, fences, and tables
        run: python scripts/ci.py docs
      - name: Install pinned actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP/actionlint"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
      - name: Install Rust formatter
        if: needs.plan.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        if: needs.plan.outputs.rust == 'true'
        run: cargo fmt --all -- --check

  # Dependency license policy and the generated notices bundled into releases.
  notices:
    name: Dependency license notices
    needs: plan
    if: needs.plan.outputs.licenses == 'true'
    runs-on: ubuntu-22.04
    env:
      CARGO_ABOUT_VERSION: '0.9.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Release packaging always compiles the renderer from source; only ordinary
      # checks may reuse the binary cached by a main-branch run.
      - name: Restore cached license renderer
        id: renderer-cache
        if: ${{ !inputs.package }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-cli-ubuntu-22.04
      - name: Install pinned license renderer
        if: steps.renderer-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "$CARGO_ABOUT_VERSION" --features cli cargo-about
      - name: Verify the renderer CLI
        run: |
          version="$(cargo about --version)"
          echo "$version"
          case "$version" in
            *"$CARGO_ABOUT_VERSION"*) ;;
            *) echo "::error::expected cargo-about $CARGO_ABOUT_VERSION"; exit 1 ;;
          esac
      - name: Save license renderer cache
        if: ${{ !inputs.package && github.ref == 'refs/heads/main' && steps.renderer-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-cli-ubuntu-22.04
      - name: Generate notices for both supported targets
        run: |
          log="$RUNNER_TEMP/cargo-about.stderr"
          if ! cargo about generate --locked --fail about.hbs --output-file "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" 2> "$log"; then
            cat "$log" >&2
            exit 1
          fi
          cat "$log" >&2
          # cargo-about can warn and succeed after discarding a changed clarification.
          # Require maintainer review rather than silently accepting fallback notices.
          test ! -s "$log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/THIRD-PARTY-NOTICES.html
          if-no-files-found: error
          retention-days: 14

  # Independent of notices so one failure never hides the other's diagnostics.
  rust:
    name: Rust (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary: animatic.exe
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            binary: animatic
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      # Release builds never restore a cache; only main saves one for pull requests.
      - name: Cache Rust dependencies
        if: ${{ !inputs.package }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release -p animatic --target ${{ matrix.target }}
      - name: Smoke the release executable
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --help
      - name: Upload CI executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animatic-${{ matrix.platform }}-x86_64
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  # Release callers only: wrap the checked executables and notices into archives.
  package:
    name: Package (${{ matrix.platform }})
    needs: [rust, notices]
    if: inputs.package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            binary: animatic.exe
          - platform: linux
            binary: animatic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: animatic-${{ matrix.platform }}-x86_64
          path: ${{ runner.temp }}/animatic-executable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/animatic-notices
      - name: Package release archive
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: python scripts/release.py package --platform "$PLATFORM" --binary "$RUNNER_TEMP/animatic-executable/$BINARY" --notices "$RUNNER_TEMP/animatic-notices/THIRD-PARTY-NOTICES.html" --output dist
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-x86_64
          path: dist/animatic-*
          if-no-files-found: error
          retention-days: 14

  # The single stable status to require on main. It always runs and fails closed:
  # a job may only be skipped when the plan did not select it.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [plan, quality, notices, rust, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify every selected check passed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_RUST: ${{ needs.plan.outputs.rust }}
          CI_LICENSES: ${{ needs.plan.outputs.licenses }}
          CI_PACKAGE: ${{ inputs.package && 'true' || 'false' }}
        run: python scripts/ci.py gate
