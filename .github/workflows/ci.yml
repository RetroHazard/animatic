name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

# Query the actual PR target before allocating build runners. Metadata-only edits
# cannot cancel a real validation run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Resolve pull request scope
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Look up the actual pull request base
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.base.ref // empty')"
          if [ -z "$base" ]; then
            echo "::error::the pull request API returned no base branch"
            exit 1
          fi
          if [ "$base" = main ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
          else
            echo "mode=defer" >> "$GITHUB_OUTPUT"
            {
              printf '### Stacked pull request deferred\n\n'
              printf 'The actual base branch is %s, not main. Code checks are deferred until the pull request targets main.\n' "$base"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'Quality' || 'PR metadata (no code checks)' }}
    needs: scope
    if: needs.scope.outputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p animatic
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: animatic-windows-x86_64
          path: target/release/animatic.exe
      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: animatic-linux-x86_64
          path: target/release/animatic
