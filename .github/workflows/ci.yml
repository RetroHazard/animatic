name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check instead of the triggering commit
        type: string
        default: ''
      package:
        description: Upload versioned release archives instead of raw executables
        type: boolean
        default: false

permissions:
  contents: read

# Stack children wait for retargeting to main; metadata edits do not cancel real checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'Quality' || 'PR metadata (no code checks)' }}
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Release tooling behavior tests
        run: python -m unittest discover -s scripts -p test_release.py -v
      - name: Validate version consistency
        run: python scripts/release.py validate
      - run: cargo fmt --all -- --check
      - name: Install pinned actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$archive" --dir "$RUNNER_TEMP/actionlint"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/actionlint/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflows
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck "$(command -v shellcheck)" -color

  notices:
    name: Dependency license notices
    needs: quality
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install pinned license renderer
        run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - name: Verify the installed CLI
        run: test "$(cargo about --version)" = 'cargo-about 0.9.3'
      - name: Generate notices for both supported targets
        run: |
          log="$RUNNER_TEMP/cargo-about.stderr"
          if ! cargo about generate --locked --fail about.hbs --output-file "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" 2> "$log"; then
            cat "$log" >&2
            exit 1
          fi
          cat "$log" >&2
          # cargo-about can warn and succeed after discarding a changed clarification.
          # Require maintainer review rather than silently accepting fallback notices.
          test ! -s "$log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/THIRD-PARTY-NOTICES.html
          if-no-files-found: error
          retention-days: 14

  test:
    name: Check (${{ matrix.platform }})
    needs: [quality, notices]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary: animatic.exe
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            binary: animatic
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libssl-dev
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --release -p animatic --target ${{ matrix.target }}
      - name: Smoke the packaged CLI entry point
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --help
      - name: Install Python for packaging
        if: inputs.package
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download dependency notices
        if: inputs.package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-notices
          path: ${{ runner.temp }}/animatic-notices
      - name: Package release archive
        if: inputs.package
        run: python scripts/release.py package --platform ${{ matrix.platform }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --notices "${{ runner.temp }}/animatic-notices/THIRD-PARTY-NOTICES.html" --output dist
      - name: Upload release archive
        if: inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-x86_64
          path: dist/animatic-*
          if-no-files-found: error
          retention-days: 14
      - name: Upload CI executable
        if: ${{ !inputs.package }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animatic-${{ matrix.platform }}-x86_64
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
