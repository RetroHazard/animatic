[package]
name = "animatic-core"
description = "Core library of Animatic (successor of AniDB O'Matic): data model, storage, legacy import, hashing, renaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.4"
animatic-anidb = { version = "2026.11.0", path = "../animatic-anidb" }
anyhow = "1.0.104"
cbc = "0.2.1"
chrono = "0.4.45"
crc32fast = "1.5.4"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.13.0"
keyring-core = "1.0.1"
log = "0.4.35"
md-5 = "0.11.0"
md4 = "0.11.0"
parking_lot = "0.13.0"
pbkdf2 = "0.13.0"
quick-xml = "0.42.0"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
shell-words = "1.1.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.5.1"
walkdir = "2.5.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# Test fixtures only: a manual clock, an in-memory limit store and loopback servers.
animatic-anidb = { version = "2026.11.0", path = "../animatic-anidb", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
winreg = "0.56.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
