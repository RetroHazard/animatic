[package]
name = "animatic-core"
description = "Core library of Animatic (successor of AniDB O'Matic): data model, storage, legacy import, hashing, renaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.4"
animatic-anidb = { version = "1.0.0", path = "../animatic-anidb" }
anyhow = "1.0.104"
cbc = "0.2.1"
chrono = "0.4.45"
crc32fast = "1.5.4"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
hex = "0.4.3"
hmac = "0.13.0"
log = "0.4.35"
md-5 = "0.11.0"
md4 = "0.11.0"
parking_lot = "0.13.0"
pbkdf2 = "0.13.0"
quick-xml = "0.42.0"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
shell-words = "1.1.1"
thiserror = "2.0.21"
walkdir = "2.5.0"
