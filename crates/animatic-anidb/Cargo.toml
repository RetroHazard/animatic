[package]
name = "animatic-anidb"
description = "AniDB UDP and HTTP API client used by Animatic"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Fixtures for tests of this crate and of the crates built on it (a manual clock, an in-memory
# limit store, a loopback HTTP server, endpoint overrides). Enabled only by dev-dependencies.
test-support = []

[dependencies]
aes = "0.9.4"
chrono = "0.4.45"
flate2 = "1.1.10"
hex = "0.4.3"
log = "0.4.35"
md-5 = "0.11.0"
parking_lot = "0.13.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
