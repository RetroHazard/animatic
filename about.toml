# cargo-about configuration for the third-party notices shipped in release archives.
#
# Generate (see docs/releases.md for the pinned cargo-about version):
#   cargo about generate --locked about.hbs --output-file "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html"
#
# The report covers the workspace's resolved dependency graph for the two release targets only.
# Build-only dependencies are intentionally kept (default): code generators such as gl_generator and
# khronos_api produce code and API data that are compiled into the application.
#
# Licenses are satisfied in the priority order below. For "A OR B" expressions the first listed
# license wins, so permissive licenses that carry per-project copyright lines are preferred over
# Apache-2.0 (whose NOTICE obligations are not tracked by cargo-about). Every entry was observed in
# the resolved graph; an unlisted license makes generation fail instead of being masked.
accepted = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "Apache-2.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# chrono ships MIT and Apache-2.0 in a single LICENSE.txt, which cargo-about cannot split on its own.
workarounds = ["chrono"]

# Crate-specific sections must stay below the global keys above.
# epaint_default_fonts embeds the fonts egui renders with. Its packaged text files are the
# authoritative licenses: Hack (MIT + Bitstream Vera), Noto Emoji (OFL-1.1), Ubuntu Light
# (Ubuntu-font-1.0) and emoji-icon-font (MIT). The crate does not package egui's own license files.
# Checksums pin these files; a changed file disables the clarification and must be re-reviewed.
[epaint_default_fonts]
accepted = ["Bitstream-Vera"]

[epaint_default_fonts.clarify]
license = "MIT AND Bitstream-Vera AND OFL-1.1 AND Ubuntu-font-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
checksum = "0a3a32afbdf4e819812135f5fa523498f3f8abdd5a262fc07bee14dd44b58a24"
license = "MIT"
start = "The work in the Hack project"
end = "OR OTHER DEALINGS IN THE SOFTWARE."

[[epaint_default_fonts.clarify.files]]
